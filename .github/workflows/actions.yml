name: run main.py

on:
  schedule:
    - cron: '*/10 * * * *' # Every 10 min
  workflow_dispatch: # Allows you to manually trigger the workflow from GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Required to allow git commit and push back to the repository
    permissions:
      contents: write

    steps:
      - name: checkout repo content
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Using '3.10' instead of '3.10.7' resolves the Ubuntu 26.04 version error
          
      - name: install python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: execute py script
        run: |
          python scrape.py
          
      - name: commit files
        run: |
          git config --local user.email "bimaldhital@gmail.com"
          git config --local user.name "833M0L3"
          git add -A
          git diff-index --quiet HEAD || (git commit -a -m "scraped notices" --allow-empty)
          
      - name: push changes
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
